<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MVP Diagnostic</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fff; color: #000; }
    .box { border: 2px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
    img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #999; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h1>1. CSV Fetch Check</h1>
  <div class="box">
    <strong>Raw File Content:</strong>
    <pre id="csv-output">Fetching abbey_house.csv...</pre>
  </div>

  <h1>2. Photo Folder Check</h1>
  <div class="box">
    <p>Testing single image load (<code>photos/Adam Grasso.jpg</code>):</p>
    <img src="photos/Adam Grasso.jpg" alt="Photo Test" onload="document.getElementById('img-status').textContent='Image loaded successfully!'" onerror="document.getElementById('img-status').textContent='Image failed to load. Check photos folder path or file extension.'">
    <p><strong id="img-status">Testing image path...</strong></p>
  </div>

  <script>
    fetch('abbey_house.csv')
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(text => {
        document.getElementById('csv-output').textContent = text;
      })
      .catch(err => {
        document.getElementById('csv-output').textContent = 'Error loading CSV: ' + err.message;
      });
  </script>

</body>
</html>
