<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pupil Lookup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f2f2f7; color: #1c1c1e; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    /* Search Header */
    .header { position: sticky; top: 0; width: 100%; max-width: 600px; background-color: #f2f2f7; z-index: 10; padding-bottom: 12px; }
    .search-input { width: 100%; padding: 14px 18px; font-size: 18px; border: 1px solid #c7c7cc; border-radius: 12px; background: #ffffff; outline: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); -webkit-appearance: none; }
    .search-input:focus { border-color: #007aff; }

    /* Loading Screen */
    #loader { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.3s ease; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e5e5ea; border-top: 4px solid #007aff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    .progress-bar-container { width: 200px; height: 8px; background: #e5e5ea; border-radius: 4px; overflow: hidden; margin-top: 12px; }
    .progress-bar { height: 100%; width: 0%; background: #007aff; transition: width 0.1s linear; }
    #loader-text { font-size: 15px; font-weight: 500; color: #8e8e93; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Grid Layout */
    #app-container { width: 100%; max-width: 600px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 8px; }

    /* Card Styling */
    .card { background: #ffffff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; padding-bottom: 10px; cursor: pointer; transition: transform 0.1s ease; }
    .card:active { transform: scale(0.97); }
    .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background-color: #e5e5ea; }
    .card-name { font-size: 15px; font-weight: 600; color: #000000; margin: 8px 6px 2px 6px; line-height: 1.2; }
    .card-meta { font-size: 12px; color: #6c6c70; padding: 0 6px; word-break: break-word; line-height: 1.3; margin-top: 2px; }
    .card-notes { font-size: 11px; color: #8e8e93; padding: 4px 6px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }

    /* Modal Overlay */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; padding: 20px; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #ffffff; border-radius: 18px; max-width: 360px; width: 100%; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; text-align: center; padding-bottom: 20px; position: relative; }
    .modal-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background-color: #e5e5ea; }
    .modal-name { font-size: 20px; font-weight: 700; color: #000000; margin: 14px 16px 4px 16px; }
    .modal-meta { font-size: 14px; color: #6c6c70; margin-bottom: 8px; padding: 0 16px; }
    .modal-notes { font-size: 13px; color: #3c3c43; background: #f2f2f7; border-radius: 10px; padding: 10px 12px; margin: 8px 16px 0 16px; width: calc(100% - 32px); text-align: left; line-height: 1.4; word-break: break-word; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.5); color: #ffffff; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">Loading... 0 / 0</div>
    <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
  </div>

  <div class="header">
    <input type="text" id="search" class="search-input" placeholder="Search name, room, form, tutor..." autofocus autocomplete="off">
  </div>

  <div id="app-container"></div>

  <!-- Modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-card">
      <button class="close-btn" id="modal-close">&times;</button>
      <img id="modal-img" src="" alt="">
      <div id="modal-name" class="modal-name"></div>
      <div id="modal-meta" class="modal-meta"></div>
      <div id="modal-notes" class="modal-notes"></div>
    </div>
  </div>

  <script>
    let pupils = [];
    const SVG_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%238e8e93'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim());
      
      return lines.slice(1).map(line => {
        if (!line.trim()) return null;
        const values = line.split(',').map(v => v.trim());
        let record = {};
        headers.forEach((h, i) => { record[h] = values[i] || ''; });
        return record;
      }).filter(Boolean);
    }

    function preloadImages(pupilList) {
      return new Promise((resolve) => {
        let loadedCount = 0;
        const total = pupilList.length;
        const loaderText = document.getElementById('loader-text');
        const progressBar = document.getElementById('progress-bar');

        if (total === 0) {
          resolve();
          return;
        }

        const checkComplete = () => {
          loadedCount++;
          loaderText.textContent = `Loading... ${loadedCount} / ${total}`;
          progressBar.style.width = `${(loadedCount / total) * 100}%`;
          if (loadedCount >= total) {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 300);
            resolve();
          }
        };

        pupilList.forEach(pupil => {
          const img = new Image();
          const imgPath = `photos/${pupil['Img name']}`;
          img.onload = () => { pupil.resolvedImg = imgPath; checkComplete(); };
          img.onerror = () => { pupil.resolvedImg = SVG_AVATAR; checkComplete(); };
          img.src = imgPath;
        });
      });
    }

    function openModal(pupil) {
      const firstName = pupil['First'] || '';
      const lastName = pupil['Last'] || '';
      const preferred = pupil['Preferred'] ? `(${pupil['Preferred']}) ` : '';
      const displayName = `${firstName} ${preferred}${lastName}`.trim();

      const metaParts = [];
      if (pupil['#Room']) metaParts.push(`Room: ${pupil['#Room']}`);
      if (pupil['Form']) metaParts.push(pupil['Form']);
      if (pupil['Tutor']) metaParts.push(`Tutor: ${pupil['Tutor']}`);

      document.getElementById('modal-img').src = pupil.resolvedImg || SVG_AVATAR;
      document.getElementById('modal-name').textContent = displayName;
      document.getElementById('modal-meta').textContent = metaParts.join(' · ');
      
      const notesEl = document.getElementById('modal-notes');
      if (pupil['Notes']) {
        notesEl.textContent = pupil['Notes'];
        notesEl.style.display = 'block';
      } else {
        notesEl.style.display = 'none';
      }

      document.getElementById('modal-backdrop').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('active');
    }

    function renderPupils(filteredList) {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      filteredList.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(p);

        const metadataParts = [];
        Object.keys(p).forEach(key => {
          if (['First', 'Last', 'Preferred', 'Img name', 'resolvedImg', 'Notes'].includes(key)) return;
          const val = p[key];
          if (!val) return;
          if (key.startsWith('#')) {
            metadataParts.push(`Room: ${val}`);
          } else {
            metadataParts.push(val);
          }
        });

        const firstName = p['First'] || '';
        const lastName = p['Last'] || '';
        const preferred = p['Preferred'] ? `(${p['Preferred']}) ` : '';
        const displayName = `${firstName} ${preferred}${lastName}`.trim();
        const footerText = metadataParts.join(' · ');
        const notesText = p['Notes'] ? `<div class="card-notes">${p['Notes']}</div>` : '';

        card.innerHTML = `
          <img src="${p.resolvedImg || SVG_AVATAR}" alt="${displayName}">
          <div class="card-name">${displayName}</div>
          <div class="card-meta">${footerText}</div>
          ${notesText}
        `;
        container.appendChild(card);
      });
    }

    function setupSearch() {
      const searchInput = document.getElementById('search');
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
          renderPupils(pupils);
          return;
        }

        const filtered = pupils.filter(p => {
          const matchFirst = (p['First'] || '').toLowerCase().startsWith(query);
          const matchLast = (p['Last'] || '').toLowerCase().startsWith(query);
          const matchPref = p['Preferred'] ? p['Preferred'].toLowerCase().startsWith(query) : false;
          const matchTutor = (p['Tutor'] || '').toLowerCase() === query;
          const matchForm = (p['Form'] || '').toLowerCase() === query;
          const matchRoom = (p['#Room'] || '').toLowerCase().startsWith(query);
          const matchNotes = (p['Notes'] || '').toLowerCase().includes(query);

          return matchFirst || matchLast || matchPref || matchTutor || matchForm || matchRoom || matchNotes;
        });

        renderPupils(filtered);
      });
    }

    function setupModalEvents() {
      document.getElementById('modal-close').onclick = closeModal;
      document.getElementById('modal-backdrop').onclick = (e) => {
        if (e.target.id === 'modal-backdrop') closeModal();
      };
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    }

    async function init() {
      try {
        const response = await fetch('abbey_house.csv');
        const csvText = await response.text();
        pupils = parseCSV(csvText);
        await preloadImages(pupils);
        renderPupils(pupils);
        setupSearch();
        setupModalEvents();
      } catch (err) {
        document.getElementById('loader-text').textContent = "Error loading pupil data.";
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
